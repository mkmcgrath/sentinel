# Sentinel Agent Configuration

# Unique identifier for this node
node_id: "node-01"

# Hostname (will be auto-detected if not specified)
hostname: ""

# Central server URL
server_url: "http://192.168.1.10:8080"

# API version
api_version: "v1"

# Reporting interval in seconds
report_interval: 10

# Services to monitor (systemd service names)
services:
  - sshd
  - docker

# Ports to check if listening
ports:
  - 22
  - 80
  - 443

# Retry settings
max_retries: 3
retry_delay: 5

# Logging
log_level: "INFO"
log_file: "/var/log/sentinel-agent.log"
