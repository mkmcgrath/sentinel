version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-network
    restart: unless-stopped

  server:
    build: ./server
    container_name: sentinel-server
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-sentinel}
      HOST: 0.0.0.0
      PORT: 8080
      RELOAD: "false"
    networks:
      - sentinel-network
    restart: unless-stopped

volumes:
  pgdata:
    name: sentinel-pgdata

networks:
  sentinel-network:
    name: sentinel-network
    driver: bridge
